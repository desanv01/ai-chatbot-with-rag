name: Validate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Validates compilation and prerendering only, not service health.
      # Never deploy this fixture or its build output.
      - name: Build with non-secret placeholders
        run: npm run build
        env:
          SUPABASE_URL: https://build-placeholder.supabase.co
          SUPABASE_ANON_KEY: build-only-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
