name: Validate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # next build is intentionally not part of this secret-free job. The
      # application validates Supabase/provider configuration while collecting
      # route data, so deployment build validation belongs in the configured
      # Vercel environment after the required secrets are present.
